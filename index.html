<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sumesh Singh Kotiwale | Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Manrope', 'sans-serif'],
            },
            colors: {
              background: "hsl(var(--background))",
              foreground: "hsl(var(--foreground))",
              border: "hsl(var(--border))",
              muted: {
                DEFAULT: "hsl(var(--muted))",
                foreground: "hsl(var(--muted-foreground))",
              },
            }
          }
        }
      }
    </script>
    <style>
      :root {
        --background: 224 71% 4%;
        --foreground: 213 31% 91%;
        --border: 216 34% 17%;
        --muted: 223 47% 11%;
        --muted-foreground: 215.4 16.3% 56.9%;
      }
      body {
        margin: 0;
        background-color: hsl(224 71% 4%);
        color: hsl(213 31% 91%);
        font-family: 'Manrope', sans-serif;
        overflow-x: hidden;
      }
      /* Lenis requirement */
      html.lenis, html.lenis body {
        height: auto;
      }
      .lenis.lenis-smooth {
        scroll-behavior: auto !important;
      }
      .lenis.lenis-smooth [data-lenis-prevent] {
        overscroll-behavior: contain;
      }
      .lenis.lenis-stopped {
        overflow: hidden;
      }
      .lenis.lenis-scrolling iframe {
        pointer-events: none;
      }

      @keyframes moveBackground {
        from {
          background-position: 0% 0%;
        }
        to {
          background-position: 0% -1000%;
        }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.556.0",
    "three": "https://aistudiocdn.com/three@^0.181.2",
    "@react-three/drei": "https://aistudiocdn.com/@react-three/drei@^10.7.7",
    "react/": "https://aistudiocdn.com/react@^19.2.1/",
    "react": "https://aistudiocdn.com/react@^19.2.1",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.1/",
    "@react-three/fiber": "https://aistudiocdn.com/@react-three/fiber@^9.4.2",
    "tailwind-merge": "https://aistudiocdn.com/tailwind-merge@^3.4.0",
    "framer-motion": "https://aistudiocdn.com/framer-motion@^12.23.25",
    "clsx": "https://aistudiocdn.com/clsx@^2.1.1",
    "lenis/": "https://aistudiocdn.com/lenis@^1.3.15/",
    "ogl": "https://esm.sh/ogl@1.0.11"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
  </body>
</html>
